name: Build 32-bit Libs

on:
  workflow_dispatch:

jobs:
  build-armeabi-v7a-libs:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build wget unzip git build-essential

      - name: Set up environment
        run: |
          mkdir -p $HOME/out/lua $HOME/out/coopnet $HOME/out/sdl2 $HOME/out/curl $HOME/src
          echo "NDK=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "TOOLCHAIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV

      - name: Build liblua.a (Lua 5.3.5)
        run: |
          cd $HOME/src
          wget https://lua.org
          tar -xzf lua-5.3.5.tar.gz
          cd lua-5.3.5/src
          rm -f lua.c luac.c
          $TOOLCHAIN/bin/armv7a-linux-androideabi24-clang -O3 -fPIC -DLUA_USE_POSIX -c *.c
          $TOOLCHAIN/bin/llvm-ar rcs $HOME/out/lua/liblua.a *.o

      - name: Build libcoopnet.a & libjuice.a
        run: |
          cd $HOME/src
          git clone --recursive https://github.com
          cd coopnet
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          find build -name "libcoopnet.a" -exec cp {} $HOME/out/coopnet/ \;
          find build -name "libjuice.a" -exec cp {} $HOME/out/coopnet/ \;

      - name: Build libSDL2.so
        run: |
          cd $HOME/src
          wget https://github.com
          tar -xzf SDL2-2.30.9.tar.gz
          cd SDL2-2.30.9
          $NDK/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=armeabi-v7a APP_PLATFORM=android-24
          cp libs/armeabi-v7a/libSDL2.so $HOME/out/sdl2/

      - name: Build libcurl.so
        run: |
          cd $HOME/src
          wget https://github.com
          tar -xzf curl-8.11.0.tar.gz
          cd curl-8.11.0
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_CURL_EXE=OFF \
            -DCURL_USE_OPENSSL=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DHTTP_ONLY=ON
          cmake --build build
          find build -name "libcurl.so" -exec cp {} $HOME/out/curl/ \;

      - name: Upload compiled 32-bit libraries
        uses: actions/upload-artifact@v4
        with:
          name: armeabi-v7a-libs
          path: $HOME/out/
