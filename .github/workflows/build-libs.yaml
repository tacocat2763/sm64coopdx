name: Build armeabi-v7a libs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-armeabi-v7a-libs:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout my repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y cmake ninja-build wget unzip git build-essential

      - name: Set up folders and NDK 27
        run: |
          mkdir -p "$GITHUB_WORKSPACE/lib/lua/android/armeabi-v7a"
          mkdir -p "$GITHUB_WORKSPACE/lib/coopnet/android/armeabi-v7a"
          mkdir -p "$GITHUB_WORKSPACE/lib/sdl2/android/armeabi-v7a"
          mkdir -p "$GITHUB_WORKSPACE/lib/curl/android/armeabi-v7a"
          mkdir -p $HOME/src
          NDK_PATH="/usr/local/lib/android/sdk/ndk/27.0.12077973"
          if [ ! -d "$NDK_PATH" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;27.0.12077973"
          fi
          echo "NDK=$NDK_PATH" >> $GITHUB_ENV
          echo "TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64" >> $GITHUB_ENV

      - name: Build liblua.a
        run: |
          cd $HOME/src
          wget "https://lua.org/ftp/lua-5.3.5.tar.gz"
          tar -xzf lua-5.3.5.tar.gz
          cd lua-5.3.5/src
          rm -f lua.c luac.c
          $TOOLCHAIN/bin/armv7a-linux-androideabi24-clang -O3 -fPIC -DLUA_USE_POSIX -c *.c
          $TOOLCHAIN/bin/llvm-ar rcs "$GITHUB_WORKSPACE/lib/lua/android/armeabi-v7a/liblua.a" *.o

      - name: Build libjuice.a & libcoopnet.a
        run: |
          cd $HOME/src
          git clone --recursive "https://github.com/paullouisageneau/libjuice.git"
          cd libjuice
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          find build -name "libjuice.a" -exec cp {} "$GITHUB_WORKSPACE/lib/coopnet/android/armeabi-v7a/" \;

          cd $HOME/src
          git clone --recursive "https://github.com/coop-deluxe/coopnet.git"
          cd coopnet
          mkdir -p bin/o/common
          for f in common/*.cpp; do
            $TOOLCHAIN/bin/armv7a-linux-androideabi24-clang++ -Wall -Wno-unused-function -std=c++11 -fPIC -DJUICE_STATIC -O3 -Icommon -Ilib/include -c "$f" -o "bin/o/common/$(basename "$f" .cpp).o"
          done
          $TOOLCHAIN/bin/llvm-ar rcs "$GITHUB_WORKSPACE/lib/coopnet/android/armeabi-v7a/libcoopnet.a" bin/o/common/*.o

      - name: Build libSDL2.so
        run: |
          cd $HOME/src
          wget "https://github.com/libsdl-org/SDL/releases/download/release-2.28.1/SDL2-2.28.1.tar.gz"
          tar -xzf SDL2-2.28.1.tar.gz
          cd SDL2-2.28.1
          sed -i 's/ALooper_pollAll/ALooper_pollOnce/g' src/sensor/android/SDL_androidsensor.c
          cp "$GITHUB_WORKSPACE/lib/sdl2/include/SDL2/SDL_system.h" include/SDL_system.h
          cat << 'EOF' >> src/core/android/SDL_android.c

          const char * SDL_AndroidGetTopExternalStoragePath(void)
          {
              static char *s_top_path = NULL;
              if (!s_top_path) {
                  JNIEnv *env = Android_JNI_GetEnv();
                  jclass envClass = (*env)->FindClass(env, "android/os/Environment");
                  jmethodID mid = (*env)->GetStaticMethodID(env, envClass, "getExternalStorageDirectory", "()Ljava/io/File;");
                  jobject fileObj = (*env)->CallStaticObjectMethod(env, envClass, mid);
                  jclass fileClass = (*env)->GetObjectClass(env, fileObj);
                  jmethodID pathMid = (*env)->GetMethodID(env, fileClass, "getAbsolutePath", "()Ljava/lang/String;");
                  jstring pathStr = (jstring)(*env)->CallObjectMethod(env, fileObj, pathMid);
                  const char *utf = (*env)->GetStringUTFChars(env, pathStr, NULL);
                  s_top_path = SDL_strdup(utf);
                  (*env)->ReleaseStringUTFChars(env, pathStr, utf);
                  (*env)->DeleteLocalRef(env, pathStr);
                  (*env)->DeleteLocalRef(env, fileClass);
                  (*env)->DeleteLocalRef(env, fileObj);
                  (*env)->DeleteLocalRef(env, envClass);
              }
              return s_top_path;
          }

          void SDL_AndroidCopyAssetFilesToDir(const char *destpath)
          {
              JNIEnv *env = Android_JNI_GetEnv();
              jclass actClass = (*env)->FindClass(env, "org/libsdl/app/SDLActivity");
              jmethodID mid = (*env)->GetStaticMethodID(env, actClass, "copyAssetFilesToDir", "(Ljava/lang/String;)V");
              jstring jDest = (*env)->NewStringUTF(env, destpath);
              (*env)->CallStaticVoidMethod(env, actClass, mid, jDest);
              (*env)->DeleteLocalRef(env, jDest);
              (*env)->DeleteLocalRef(env, actClass);
          }
          EOF
          $NDK/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk APP_ABI=armeabi-v7a APP_PLATFORM=android-24
          cp libs/armeabi-v7a/libSDL2.so "$GITHUB_WORKSPACE/lib/sdl2/android/armeabi-v7a/"

      - name: Build libcurl.so
        run: |
          cd $HOME/src
          wget "https://github.com/curl/curl/releases/download/curl-8_11_0/curl-8.11.0.tar.gz"
          tar -xzf curl-8.11.0.tar.gz
          cd curl-8.11.0
          cmake -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_CURL_EXE=OFF \
            -DCURL_USE_OPENSSL=OFF \
            -DCURL_USE_LIBPSL=OFF \
            -DCURL_DISABLE_LDAP=ON \
            -DHTTP_ONLY=ON
          cmake --build build
          find build -name "libcurl.so" -exec cp {} "$GITHUB_WORKSPACE/lib/curl/android/armeabi-v7a/" \;

      - name: Save all 5 files directly into my GitHub repo
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add -f lib/lua/android/armeabi-v7a/liblua.a
          git add -f lib/coopnet/android/armeabi-v7a/libcoopnet.a
          git add -f lib/coopnet/android/armeabi-v7a/libjuice.a
          git add -f lib/sdl2/android/armeabi-v7a/libSDL2.so
          git add -f lib/curl/android/armeabi-v7a/libcurl.so
          git commit -m "Rebuild 32-bit armeabi-v7a libraries with NDK 27 and custom SDL2 helpers"
          git push

      - name: Backup zip
        uses: actions/upload-artifact@v4
        with:
          name: armeabi-v7a-lib-folder
          path: lib/
